<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ERP S&P 500">
<meta name="theme-color" content="#0f172a">
<title>Prima de riesgo S&P 500</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mut:#64748b;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ac:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;padding:max(16px,env(safe-area-inset-top)) 16px 24px;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
.hero{background:var(--card);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px}
.hero b{display:block;font-size:44px;color:var(--ac)}.hero span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{background:var(--card);border-radius:12px;padding:14px}.c small{color:var(--mut);font-size:12px}.c b{display:block;font-size:22px;margin-top:2px}
.ch{background:var(--card);border-radius:12px;padding:14px;margin-top:12px}svg{width:100%;height:120px}
.n{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.4}
</style></head><body>
<h1>Prima de riesgo del equity</h1><div class="sub" id="f">Cargando…</div>
<div id="app"></div>
<div class="n">ERP = (1/PER) − bono EE.UU. 10 años. PER del S&P 500 estimado vía SPY (Yahoo Finance); puede diferir de otras fuentes.</div>
<script>
const f=(n,d=2)=>n.toLocaleString("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d});
fetch("data.json?"+Date.now()).then(r=>r.json()).then(h=>{
  const x=h[h.length-1], p=h[h.length-2];
  document.getElementById("f").textContent="Cierre del "+x.date.split("-").reverse().join("/");
  const d=p?x.erp-p.erp:0;
  let svg="";
  if(h.length>1){const v=h.map(e=>e.erp),mn=Math.min(...v),mx=Math.max(...v)||1,r=(mx-mn)||1;
    const pts=v.map((y,i)=>(i/(v.length-1)*300).toFixed(1)+","+(110-(y-mn)/r*100).toFixed(1)).join(" ");
    svg=`<div class="ch"><small style="color:var(--mut)">Evolución ERP (%)</small><svg viewBox="0 0 300 120" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`}
  document.getElementById("app").innerHTML=`
  <div class="hero"><span>Prima de riesgo</span><b>${f(x.erp)}%</b><span>${p?(d>=0?"▲ ":"▼ ")+f(Math.abs(d))+" pp vs. sesión anterior":""}</span></div>
  <div class="grid">
   <div class="c"><small>S&P 500 (cierre)</small><b>${f(x.close)}</b></div>
   <div class="c"><small>PER</small><b>${f(x.per,1)}</b></div>
   <div class="c"><small>Earnings yield</small><b>${f(x.ey)}%</b></div>
   <div class="c"><small>Bono EE.UU. 10a</small><b>${f(x.us10y)}%</b></div>
  </div>${svg}`;
}).catch(()=>document.getElementById("f").textContent="Sin datos todavía: ejecuta el workflow una vez.");
</script></body></html>
